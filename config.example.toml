# Skopiuj ten plik jako config.toml i uzupełnij.

[ogolne]
# Tu trafi indeks (indeks.sqlite) i sesja Telegrama (telegram.session).
katalog_danych = "dane"

[telegram]
# Z https://my.telegram.org -> API development tools
api_id = 0
api_hash = ""
# Opcjonalnie, np. "+447700900123" (inaczej program zapyta przy logowaniu)
telefon = ""

# Puste = indeksuj wszystkie czaty. Fragmenty nazw, wielkość liter i ogonki bez znaczenia.
tylko_czaty = []
# np. ["BBC", "Reuters"] — duże kanały informacyjne, których nie chcesz w indeksie
pomin_czaty = []
# true = pomiń wszystkie kanały (broadcast); grupy i prywatne zostają
pomin_kanaly = false

# Publiczne kanały/grupy, do których NIE należysz, a chcesz je indeksować
# (czytane bez dołączania). Np. ["@bbcnews", "https://t.me/rsgb_main"]
obserwowane = []
# Ile ostatnich wiadomości pobrać z obserwowanego kanału przy pierwszej synchronizacji
limit_obserwowanych = 2000

# Przy PIERWSZEJ synchronizacji czatu: ile najnowszych wiadomości pobrać.
# 0 = cała historia (przy dużych grupach może trwać długo — Telegram ogranicza tempo).
limit_pierwszej_synchronizacji = 0

[ai]
# Klucz Claude API (console.anthropic.com). Lepiej ustawić zmienną środowiskową
# ANTHROPIC_API_KEY niż wpisywać tutaj. Bez klucza działa "szukaj", nie działa "pytaj".
klucz_api = ""
# Tani i szybki model do zamiany promptu na zapytanie:
model_zapytan = "claude-haiku-5-5"
# Model do streszczenia wyników i odpowiedzi:
model_odpowiedzi = "claude-sonnet-5-5"
max_wynikow_do_odpowiedzi = 40

[lokalne_ai]
# Lokalne AI przez Ollamę (albo LM Studio): ocenia wyniki (news / spam / 18+),
# tłumaczy na polski i sprawdza zdjęcia z publicznych kanałów. Nic nie wychodzi do internetu.
wlaczone = true
adres_ollama = "http://127.0.0.1:11434"
adres_lmstudio = "http://127.0.0.1:1234"
# "auto" = wybierz z zainstalowanych (tekst: np. qwen3:14b, obraz: np. qwen3-vl:8b)
model_tekst = "auto"
model_obraz = "auto"
tlumacz_automatycznie = true
jezyk_docelowy = "polski"
sprawdzaj_zdjecia = true
# "zwin" = ukryte wyniki na dole listy (przycisk „Pokaż ukryte”), "usun" = w ogóle ich nie pokazuj
ukryte = "zwin"

[filtr]
# Tarcza antyspamowa bez AI (ściana hashtagów, kasyna, 18+ itp.)
tarcza = true
# Kanały, które ukryłeś przyciskiem „🚫 Ukryj kanał” (id albo nazwa)
ukryte_kanaly = []
