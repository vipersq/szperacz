[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szperacz"
version = "1.1.0"
description = "Wyszukiwarka wiadomości ze wszystkich komunikatorów (na start: Telegram)"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "anthropic>=0.40",
    "qrcode>=7.4",
    "pillow>=10.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
szperacz = "szperacz.cli:main"

[project.gui-scripts]
szperacz-gui = "szperacz.gui:main"

[tool.setuptools]
packages = ["szperacz", "szperacz.connectors"]
